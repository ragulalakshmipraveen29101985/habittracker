<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streak — Habit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #F4EFE6;
      --cream-2: #ECE5D6;
      --paper: #FBF8F2;
      --ink: #1B1A16;
      --ink-soft: #4A4640;
      --ink-mute: #8A857C;
      --line: #E2DACA;
      --line-strong: #C9BFA9;
      --navy: #1E2740;
      --navy-2: #2A3556;
      --sage: #7C9A6B;
      --sage-deep: #5F7E50;
      --sage-soft: #D9E3CD;
      --coral: #C97C5D;
      --amber: #C9A24A;

      --serif: "Instrument Serif", "Times New Roman", Georgia, serif;
      --sans: "Helvetica Neue", Helvetica, "Arial", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--cream);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-size: 14px;
      line-height: 1.45;
    }
    button { font-family: inherit; cursor: pointer; }
    input, textarea { font-family: inherit; }
    ::selection { background: var(--sage-soft); }

    .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
    .mono { font-family: var(--mono); }
    .it { font-style: italic; }

    /* Scrollbar (subtle) */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid var(--cream); }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }

    #root { min-height: 100vh; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="seed.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="login.jsx"></script>
  <script type="text/babel" src="dashboard.jsx"></script>
  <script type="text/babel" src="tracker.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
